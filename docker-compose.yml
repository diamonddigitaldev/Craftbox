services:
  craftbox:
    build: .
    container_name: craftbox
    restart: unless-stopped
    ports:
      - "6464:6464"     # Web panel
      - "25565:25565"   # Default Minecraft server port
      # Add more ports as needed for additional servers:
      # - "25566:25566"
      # - "25567:25567"
    volumes:
      - craftbox-data:/app/data
    environment:
      - LOG_LEVEL=DEBUG
      # - PORT=6464 # Change if you want to run the web panel on a different port
      # - NODE_ENV=production # Will require HTTPS for secure cookies, so only enable if you have a reverse proxy with SSL
      # - TRUST_PROXY=1 # Number of reverse proxies in front of Craftbox (e.g. Nginx, Caddy, Cloudflare Tunnel), so that rate limiting and secure cookies see the real client. 2 for a proxy behind a proxy. Never more than you actually have
    stop_grace_period: 45s

volumes:
  craftbox-data:
