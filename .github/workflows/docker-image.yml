name: Build and Publish Craftbox to Docker Hub
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}
  PRERELEASE: ${{ github.event.release.prerelease }}

jobs:
  # The pre-release flag decides the tags, so refuse a release whose flag
  # disagrees with its version, or whose version disagrees with package.json.
  # First, so a bad release fails before the long checks.
  check_tag:
    name: Check release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release tag
        run: |
          if [[ "$TAG" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "::error::$TAG is a pre-release version but the release is not marked as a pre-release."
            exit 1
          fi
          if [[ "$TAG" != *-* && "$PRERELEASE" == "true" ]]; then
            echo "::error::$TAG is a stable version but the release is marked as a pre-release."
            exit 1
          fi
          PKG_VERSION=$(jq -r .version package.json)
          if [[ "${TAG#v}" != "$PKG_VERSION" ]]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION."
            exit 1
          fi

  # Every check, the weekly ones included, against the release's own commit.
  # Nothing is published unless all of them pass; after a failure (an
  # upstream outage included), re-run the failed jobs to publish.
  ci:
    name: CI
    needs: check_tag
    uses: ./.github/workflows/ci.yml

  ci_extended:
    name: CI (extended)
    needs: check_tag
    uses: ./.github/workflows/ci-extended.yml

  publish_image:
    name: Publish image
    needs: [ci, ci_extended]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: willtda/craftbox
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.PRERELEASE != 'true' }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ env.PRERELEASE != 'true' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}
            type=raw,value=next,enable=${{ env.PRERELEASE == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # From the build cache the checks' images just filled (amd64 in CI,
      # arm64 natively in CI (extended)), so wherever the cache holds them,
      # the layers pushed are the ones that were tested
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=gha,scope=arm64
          push: true
