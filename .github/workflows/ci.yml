name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Weekly as well: "latest version" moves upstream (new Minecraft releases,
  # loader builds) without any commit here to trigger a run.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pure logic, run straight from the checkout: no image, no npm install
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run unit tests
        run: npm test

  # Build the real image once; every check below runs against it, so CI tests
  # exactly what gets published (the Java runtimes included).
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: craftbox:ci
          outputs: type=docker,dest=${{ runner.temp }}/craftbox-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: craftbox-image
          path: ${{ runner.temp }}/craftbox-image.tar
          retention-days: 1

  api:
    name: API smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: craftbox-image
          path: ${{ runner.temp }}

      - name: Start Craftbox
        run: |
          docker load --input "$RUNNER_TEMP/craftbox-image.tar"
          docker run -d --name craftbox -p 6464:6464 craftbox:ci

      - name: Run API smoke test
        run: node test/ci/api-smoke.mjs
        env:
          CRAFTBOX_URL: http://localhost:6464

      - name: Craftbox log
        if: failure()
        run: docker logs craftbox

  # The rest of the panel, each against a fresh instance of its own. They can
  # reach into the container (CRAFTBOX_CONTAINER) to age a session, kill a
  # JVM or restart the panel.
  checks:
    name: ${{ matrix.name }} test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            script: web.mjs
          - name: WebSocket
            script: websocket.mjs
          # Headless, in the Chrome the runner already has
          - name: Browser
            script: browser.mjs
          # The two halves of the operations test run side by side
          - name: Lifecycle
            script: operations.mjs lifecycle
          - name: Backups
            script: operations.mjs backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: craftbox-image
          path: ${{ runner.temp }}

      - name: Start Craftbox
        run: |
          docker load --input "$RUNNER_TEMP/craftbox-image.tar"
          docker run -d --name craftbox -p 6464:6464 craftbox:ci

      - name: Run ${{ matrix.name }} test
        run: node test/ci/${{ matrix.script }}
        env:
          CRAFTBOX_URL: http://localhost:6464
          CRAFTBOX_CONTAINER: craftbox

      - name: Craftbox log
        if: failure()
        run: docker logs craftbox

  servers:
    name: Start ${{ matrix.type }} (latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One broken upstream shouldn't hide the state of the others
      fail-fast: false
      matrix:
        type: [vanilla, paper, purpur, folia, fabric, forge, neoforge]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: craftbox-image
          path: ${{ runner.temp }}

      - name: Start Craftbox
        run: |
          docker load --input "$RUNNER_TEMP/craftbox-image.tar"
          docker run -d --name craftbox -p 6464:6464 craftbox:ci

      - name: Start a ${{ matrix.type }} server
        run: node test/ci/server-start.mjs ${{ matrix.type }}
        env:
          CRAFTBOX_URL: http://localhost:6464

      - name: Craftbox log
        if: failure()
        run: docker logs craftbox
